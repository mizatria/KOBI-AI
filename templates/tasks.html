<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Görev Yönetimi - Kanban</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    <style>
        :root {
            --sidebar-bg:     #2c3a1e;
            --sidebar-active: #4a6a2a;
            --accent-green:   #7ab648;
            --accent-gold:    #c8922a;
            --page-bg:        #f5f0e8;
            --card-bg:        #ffffff;
            --column-bg:      #e8e2d6;
            --border-color:   #d4ccbc;
            --text-dark:      #2c3a1e;
            --text-muted:     #6b6455;
            --navbar-bg:      #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--page-bg);
        }

        .navbar {
            background-color: var(--navbar-bg);
            box-shadow: 0 2px 4px rgba(44,58,30,0.08);
            border-bottom: 1px solid var(--border-color);
        }

        .navbar-brand {
            color: var(--accent-gold) !important;
            font-weight: 600;
        }

        .btn-primary {
            background-color: var(--accent-green);
            border-color: var(--accent-green);
            color: #fff;
        }
        .btn-primary:hover {
            background-color: #5e9632;
            border-color: #5e9632;
        }

        .btn-outline-danger {
            color: #a0522d;
            border-color: #a0522d;
        }
        .btn-outline-danger:hover {
            background-color: #a0522d;
            color: #fff;
        }

        .kanban-board {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
            min-height: calc(100vh - 100px);
            align-items: flex-start;
        }

        .kanban-column {
            background-color: var(--column-bg);
            border-radius: 10px;
            border: 1px solid var(--border-color);
            width: 33.333%;
            min-width: 320px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .kanban-column h5 {
            font-weight: 600;
            margin-bottom: 15px;
            font-size: 1rem;
            color: var(--text-dark);
            display: flex;
            align-items: center;
        }

        .kanban-tasks {
            flex-grow: 1;
            min-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-card {
            background-color: var(--card-bg);
            border: none;
            box-shadow: 0 1px 3px rgba(44,58,30,0.12);
            border-radius: 8px;
            padding: 12px;
            cursor: grab;
            transition: box-shadow 0.2s;
        }
        .task-card:active { cursor: grabbing; }
        .task-card:hover {
            box-shadow: 0 3px 8px rgba(44,58,30,0.18);
        }

        .task-card.badge-bekliyor   { border-left: 5px solid #c8922a; }
        .task-card.badge-yapiliyor  { border-left: 5px solid #4a9aba; }
        .task-card.badge-tamamlandi { border-left: 5px solid #7ab648; }

        .task-card h6 { color: var(--text-dark); }
        .task-card p  { color: var(--text-muted); }

        .badge.bg-secondary {
            background-color: #d4ccbc !important;
            color: var(--text-dark);
        }

        #count-Bekliyor   { background-color: #c8922a !important; }
        #count-Yapılıyor  { background-color: #4a9aba !important; }
        #count-Tamamlandı { background-color: #7ab648 !important; }

        .sortable-ghost {
            opacity: 0.4;
            background-color: #c8bfae;
        }

        .modal-header {
            background-color: var(--sidebar-bg);
            color: #fff;
        }
        .modal-header .btn-close { filter: invert(1); }
        .modal-title { color: #fff !important; }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-green);
            box-shadow: 0 0 0 0.2rem rgba(122,182,72,0.2);
        }

        body { display: flex; min-height: 100vh; }
        .sidebar {
            width: 260px;
            background-color: var(--sidebar-bg);
            color: #e8edd0;
            position: fixed;
            height: 100vh;
            padding: 24px;
            display: flex;
            flex-direction: column;
            z-index: 1000;
        }
        .sidebar-brand {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 36px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #6b7c3a;
            margin-bottom: 12px;
            display: block;
        }
        .nav-group { margin-bottom: 28px; }
        .sidebar-nav a {
            display: flex;
            align-items: center;
            padding: 11px 14px;
            color: #e8edd0;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 6px;
            font-weight: 500;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        .sidebar-nav a:hover, .sidebar-nav a.active {
            background-color: var(--sidebar-active);
            color: #fff;
        }
        .sidebar-nav a span { margin-left: 10px; }

        .main-content {
            margin-left: 260px;
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
        }
        .page-header h1 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text-dark);
        }
        .page-header p { color: var(--text-muted); font-size: 0.88rem; margin-top: 4px; }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="sidebar-brand">📦 <span>Kopi</span></div>

    <div class="nav-group">
        <span class="nav-label">MENÜ</span>
        <nav class="sidebar-nav">
            <a href="/dashboard/">📊 <span>Dashboard</span></a>
            <a href="/orders/">📦 <span>Siparişler</span></a>
            <a href="/customers/">👥 <span>Müşteriler</span></a>
        </nav>
    </div>

    <div class="nav-group">
        <span class="nav-label">YÖNETİM</span>
        <nav class="sidebar-nav">
            <a href="/products/">🍎 <span>Ürün Yönetimi</span></a>
            <a href="/suppliers/">🚚 <span>Tedarikçiler</span></a>
            <a href="/tasks/" class="active">✅ <span>Görev Listesi (Todo)</span></a>
        </nav>
    </div>

    <div style="margin-top: auto;">
        <button onclick="logout()" style="width:100%; background: transparent; border: 1px solid #6b7c3a; color: #e8edd0; padding: 10px; border-radius: 8px; cursor: pointer; font-size: 0.9rem;">
            🚪 Çıkış Yap
        </button>
    </div>
</aside>

<div class="main-content">
    <div class="page-header">
        <div>
            <h1>✅ Görev Listesi</h1>
            <p>Görevlerinizi sürükleyerek yönetin.</p>
        </div>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addTaskModal">
            + Yeni Görev
        </button>
    </div>

    <div class="kanban-board">
        <div class="kanban-column">
            <h5>
                🟠 Bekliyor
                <span class="badge ms-auto rounded-pill" id="count-Bekliyor">0</span>
            </h5>
            <div class="kanban-tasks" id="column-Bekliyor" data-status="Bekliyor"></div>
        </div>

        <div class="kanban-column">
            <h5>
                🔵 Yapılıyor
                <span class="badge ms-auto rounded-pill" id="count-Yapılıyor">0</span>
            </h5>
            <div class="kanban-tasks" id="column-Yapılıyor" data-status="Yapılıyor"></div>
        </div>

        <div class="kanban-column">
            <h5>
                🟢 Tamamlandı
                <span class="badge ms-auto rounded-pill" id="count-Tamamlandı">0</span>
            </h5>
            <div class="kanban-tasks" id="column-Tamamlandı" data-status="Tamamlandı"></div>
        </div>
    </div>
</div>

<div class="modal fade" id="addTaskModal" tabindex="-1" aria-labelledby="addTaskModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="addTaskModalLabel">Yeni Görev Ekle</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Kapat"></button>
      </div>
      <div class="modal-body">
        <form id="taskForm">
            <div class="mb-3">
                <label class="form-label">Başlık</label>
                <input type="text" id="title" class="form-control" required placeholder="Görevi kısaca özetleyin...">
            </div>
            <div class="mb-3">
                <label class="form-label">Açıklama (İsteğe Bağlı)</label>
                <textarea id="description" class="form-control" rows="3" placeholder="Detayları buraya yazabilirsiniz..."></textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Görev Tipi</label>
                <select id="task_type" class="form-select">
                    <option value="Genel">Genel (Todo)</option>
                    <option value="Paketleme">Paketleme</option>
                    <option value="Tedarikçi">Tedarikçi</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Ekle</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    const API_URL = '/tasks/api';

    document.addEventListener('DOMContentLoaded', () => {
        initSortable();
        fetchTasks();
    });

    async function fetchWithAuth(url, options = {}) {
        const headers = { 'Content-Type': 'application/json' };
        const response = await fetch(url, { ...options, headers, credentials: 'same-origin' });
        if (response.status === 401) {
            window.location.href = '/auth/login';
        }
        return response;
    }

    function initSortable() {
        const columns = ['Bekliyor', 'Yapılıyor', 'Tamamlandı'];
        columns.forEach(status => {
            const el = document.getElementById(`column-${status}`);
            new Sortable(el, {
                group: 'kanban',
                animation: 150,
                ghostClass: 'sortable-ghost',
                onEnd: async function (evt) {
                    const itemEl = evt.item;
                    const toColumn = evt.to;
                    const fromColumn = evt.from;
                    if (toColumn !== fromColumn) {
                        const taskId = itemEl.getAttribute('data-id');
                        const newStatus = toColumn.getAttribute('data-status');
                        itemEl.className = itemEl.className.replace(/badge-\w+/g, '');
                        if (newStatus === 'Bekliyor')   itemEl.classList.add('badge-bekliyor');
                        if (newStatus === 'Yapılıyor')  itemEl.classList.add('badge-yapiliyor');
                        if (newStatus === 'Tamamlandı') itemEl.classList.add('badge-tamamlandi');
                        updateCounts();
                        try {
                            const res = await fetchWithAuth(`${API_URL}/${taskId}/status`, {
                                method: 'PUT',
                                body: JSON.stringify({ status: newStatus })
                            });
                            if (!res.ok) throw new Error("Status could not be updated");
                        } catch (error) {
                            alert("Durum güncellenirken sunucu hatası oluştu!");
                            fetchTasks();
                        }
                    }
                },
            });
        });
    }

    async function fetchTasks() {
        try {
            const response = await fetchWithAuth(API_URL + '/');
            const tasks = await response.json();
            renderTasks(tasks);
        } catch (error) {
            console.error('Görevler yüklenirken hata oluştu:', error);
        }
    }

    function renderTasks(tasks) {
        const columns = {
            'Bekliyor':   document.getElementById('column-Bekliyor'),
            'Yapılıyor':  document.getElementById('column-Yapılıyor'),
            'Tamamlandı': document.getElementById('column-Tamamlandı')
        };
        Object.values(columns).forEach(col => col.innerHTML = '');
        tasks.forEach(task => {
            let badgeClass = 'badge-bekliyor';
            if (task.status === 'Yapılıyor')  badgeClass = 'badge-yapiliyor';
            if (task.status === 'Tamamlandı') badgeClass = 'badge-tamamlandi';
            const card = document.createElement('div');
            card.className = `task-card ${badgeClass}`;
            card.setAttribute('data-id', task.id);
            card.innerHTML = `
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <h6 class="fw-bold mb-0">${task.title}</h6>
                    <button class="btn-close" style="font-size:0.5rem;" onclick="deleteTask(${task.id})"></button>
                </div>
                <span class="badge bg-secondary mb-2" style="font-size:0.7rem;">${task.task_type}</span>
                <p class="small mb-0" style="line-height:1.3;">${task.description || ''}</p>
            `;
            const col = columns[task.status] || columns['Bekliyor'];
            col.appendChild(card);
        });
        updateCounts();
    }

    function updateCounts() {
        ['Bekliyor', 'Yapılıyor', 'Tamamlandı'].forEach(status => {
            const count = document.getElementById(`column-${status}`).children.length;
            document.getElementById(`count-${status}`).innerText = count;
        });
    }

    document.getElementById('taskForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const data = {
            title: document.getElementById('title').value,
            description: document.getElementById('description').value,
            task_type: document.getElementById('task_type').value,
            status: 'Bekliyor'
        };
        const res = await fetchWithAuth(API_URL + '/', { method: 'POST', body: JSON.stringify(data) });
        if (res.ok) {
            document.getElementById('taskForm').reset();
            bootstrap.Modal.getInstance(document.getElementById('addTaskModal')).hide();
            fetchTasks();
        } else {
            alert('Görev eklenemedi!');
        }
    });

    async function deleteTask(taskId) {
        if (!confirm('Bu görevi silmek istediğinize emin misiniz?')) return;
        const res = await fetchWithAuth(`${API_URL}/${taskId}`, { method: 'DELETE' });
        if (res.ok) fetchTasks();
    }

    function logout() {
        window.location.href = '/auth/logout';
    }
</script>
</body>
</html>
